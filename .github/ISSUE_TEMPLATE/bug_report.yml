name: Bug report
description: Something is not working correctly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before reporting, check if the issue already exists in [open issues](https://github.com/wielorzeczownik/zed-volt/issues).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Syntax highlighting
        - Snippets
        - Brackets or comments
        - Other
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Template sample
      description: The smallest piece of Volt that shows the problem.
      render: twig
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 'e.g. v0.1.0'
    validations:
      required: true

  - type: input
    id: zed_version
    attributes:
      label: Zed version
      description: 'Shown in Zed under `zed: about`.'
      placeholder: 'e.g. 0.210.4'
    validations:
      required: true
