name: Bug report
description: Something is not working correctly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Any detail helps, but don't worry if you don't know all of it. If you have a moment, a quick look through [open issues](https://github.com/wielorzeczownik/zed-volt/issues) helps avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Syntax highlighting
        - Snippets
        - Brackets or comments
        - Other
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Template sample
      description: The smallest piece of Volt that shows the problem.
      render: twig

  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 'e.g. v0.1.0'

  - type: input
    id: zed_version
    attributes:
      label: Zed version
      description: 'Shown in Zed under `zed: about`.'
      placeholder: 'e.g. 0.210.4'
